name: automerge-gate
description: |
  Polls check_run results for a PR and gates merge via the gate job's exit
  code (success/failure). The job's check_run conclusion is what GitHub's
  required-check evaluates, so the action works uniformly on same-repo and
  fork PRs. Set `name: automerge-gate/all-passed` on the gate job to match
  the required-check context. An aggregated commit status is also written
  as a courtesy when the token has write permission.
author: azu

branding:
  icon: check-circle
  color: green

inputs:
  context:
    description: 'Commit status context name to write. Must match the required check in your ruleset.'
    required: false
    default: 'automerge-gate/all-passed'
  poll-interval-seconds:
    description: 'How often (seconds) to re-fetch check status during the polling loop'
    required: false
    default: '30'
  ignore-apps:
    description: 'GitHub App slugs whose check_runs are excluded. Comma-separated or newline-separated.'
    required: false
    default: ''
  ignore-checks:
    description: 'check_run name patterns to exclude. Glob (* / ?) supported. Comma-separated or newline-separated.'
    required: false
    default: ''
  mode:
    description: 'Gating mode. "commit-status" (default) writes the aggregated commit status. "fork-gate" skips status writes entirely — use this in a fork-only job whose name matches the required check, since fork PRs have a read-only token.'
    required: false
    default: 'commit-status'
  token:
    description: 'GitHub token used to read checks and (when permitted) write commit status'
    required: false
    default: ${{ github.token }}

outputs:
  state:
    description: 'Final state: pending, success, or failure'
  total-checks:
    description: 'Number of check_runs observed before filtering'
  evaluated-checks:
    description: 'Number of check_runs after filtering'
  completed-checks:
    description: 'Number of completed check_runs after filtering'
  polled-iterations:
    description: 'Number of polling iterations performed (0 in pending mode)'

runs:
  using: 'node24'
  main: 'dist/index.js'
